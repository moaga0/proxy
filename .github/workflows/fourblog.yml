name: fourblog-crawl

on:
  workflow_dispatch:
    inputs:
      maxPage:
        required: true
        default: "10"

jobs:
  crawl:
    runs-on: ubuntu-latest

    env:
      # ====== 프록시 풀 (회전용) ======
      PROXY_LIST: |
        socks5h://${{ secrets.PROXY_USER }}:${{ secrets.PROXY_PASS }}@${{ secrets.PROXY_HOST }}:${{ secrets.PROXY_PORT }}
        socks5h://${{ secrets.PROXY_USER }}:${{ secrets.PROXY_PASS }}@${{ secrets.PROXY_HOST_2 }}:${{ secrets.PROXY_PORT_2 }}
        socks5h://${{ secrets.PROXY_USER }}:${{ secrets.PROXY_PASS }}@${{ secrets.PROXY_HOST_3 }}:${{ secrets.PROXY_PORT_3 }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Prepare workspace
        run: |
          mkdir -p tmp/visit tmp/shipping
          echo '{"visit":{"pages":[]}, "shipping":{"pages":[]}}' > result.json

      # ============================
      # 세션 단위 UA + 프록시 선정 (완전 자급자족)
      # ============================
      - name: Select Session UA & Proxy
        id: session
        run: |
          # ===== User-Agent 풀 (필요하면 확장 가능) =====
          UA_LIST='
          Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (Chrome/120.0.0.0 Safari/537.36)
          Mozilla/5.0 (Macintosh; Intel Mac OS X 13_5) AppleWebKit/605.1.15 (Version/16.6 Safari/605.1.15)
          Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:122.0) Gecko/20100101 Firefox/122.0
          Mozilla/5.0 (Macintosh; Intel Mac OS X 14_2) AppleWebKit/537.36 (Chrome/121.0.0.0 Safari/537.36)
          '

          SELECTED_UA=$(echo "$UA_LIST" | sed '/^$/d' | shuf -n 1 | sed 's/^ *//;s/ *$//')
          SELECTED_PROXY=$(echo "$PROXY_LIST" | sed '/^$/d' | shuf -n 1 | sed 's/^ *//;s/ *$//')

          echo "SELECTED_UA=$SELECTED_UA" >> $GITHUB_OUTPUT
          echo "SELECTED_PROXY=$SELECTED_PROXY" >> $GITHUB_OUTPUT

          echo "🧑‍💻 Session UA: $SELECTED_UA"
          echo "🌐 Session Proxy: $SELECTED_PROXY"

      - name: Debug Proxy (필수 체크)
        run: |
          echo "Testing proxy: ${{ steps.session.outputs.SELECTED_PROXY }}"
          curl -x "${{ steps.session.outputs.SELECTED_PROXY }}" https://ipinfo.io || echo "⚠️ PROXY TEST FAILED"

      # ======================
      # VISIT (local)
      # ======================
      - name: Crawl FourBlog VISIT (local)
        run: |
          set -e

          for ((p=1; p<=${{ inputs.maxPage }}; p++)); do
            OFFSET=$(( (p - 1) * 30 ))
            echo "🚀 Fetching VISIT page $p (offset=$OFFSET)"

            #URL="https://4blog.net/loadMoreDataCategory?offset=$OFFSET&limit=30&category=all&category1=local&location=&location1=&search=&bid="
            URL="https://4blog.net/loadMoreDataCategoryV2?offset=$OFFSET&limit=30&maxLoadCount=479&category=&sort=latest&category1=local&location=&location1=&search=&search2=&bid="

            RES=$(curl -s \
              -x "${{ steps.session.outputs.SELECTED_PROXY }}" \
              -A "${{ steps.session.outputs.SELECTED_UA }}" \
              -w "\nHTTP_STATUS:%{http_code}" \
              "$URL" || true)

            BODY=$(echo "$RES" | sed -n '1,/HTTP_STATUS:/p' | sed '$d')
            STATUS=$(echo "$RES" | grep "HTTP_STATUS:" | awk -F: '{print $2}')

            echo "➡️ HTTP Status: $STATUS"

            if [ "$STATUS" != "200" ]; then
              echo "🛑 Stop crawling (status != 200)"
              break
            fi

            COUNT=$(echo "$BODY" | jq 'length' 2>/dev/null || echo 0)
            if [ "$COUNT" -eq 0 ]; then
              echo "⛔ No more data. Stop."
              break
            fi

            echo "$BODY" > tmp/visit_page_${p}.json

            jq --arg p "$p" --slurpfile pageData tmp/visit_page_${p}.json \
              '.visit.pages += [{"page": ($p|tonumber), "data": $pageData[0]}]' result.json > tmp.json

            mv tmp.json result.json

            # ✅ 사람처럼 3~5초 랜덤 대기
            SLEEP_SEC=$((RANDOM % 3 + 3))
            echo "😴 Sleeping ${SLEEP_SEC}s..."
            sleep $SLEEP_SEC
          done

      # ======================
      # SHIPPING (deliv)
      # ======================
      - name: Crawl FourBlog SHIPPING (deliv)
        run: |
          set -e

          for ((p=1; p<=${{ inputs.maxPage }}; p++)); do
            OFFSET=$(( (p - 1) * 30 ))
            echo "🚀 Fetching SHIPPING page $p (offset=$OFFSET)"

            #URL="https://4blog.net/loadMoreDataCategory?offset=$OFFSET&limit=30&category=all&category1=deliv&location=&location1=&search=&bid="
            URL="https://4blog.net/loadMoreDataCategoryV2?offset=$OFFSET&limit=30&maxLoadCount=465&category=&sort=popular&category1=deliv&location=&location1=&search=&search2=&bid="
            
            RES=$(curl -s \
              -x "${{ steps.session.outputs.SELECTED_PROXY }}" \
              -A "${{ steps.session.outputs.SELECTED_UA }}" \
              -w "\nHTTP_STATUS:%{http_code}" \
              "$URL" || true)

            BODY=$(echo "$RES" | sed -n '1,/HTTP_STATUS:/p' | sed '$d')
            STATUS=$(echo "$RES" | grep "HTTP_STATUS:" | awk -F: '{print $2}')

            echo "➡️ HTTP Status: $STATUS"

            if [ "$STATUS" != "200" ]; then
              echo "🛑 Stop crawling (status != 200)"
              break
            fi

            COUNT=$(echo "$BODY" | jq 'length' 2>/dev/null || echo 0)
            if [ "$COUNT" -eq 0 ]; then
              echo "⛔ No more data. Stop."
              break
            fi

            echo "$BODY" > tmp/shipping_page_${p}.json

            jq --arg p "$p" --slurpfile pageData tmp/shipping_page_${p}.json \
              '.shipping.pages += [{"page": ($p|tonumber), "data": $pageData[0]}]' result.json > tmp.json

            mv tmp.json result.json

            # ✅ 동일한 대기 전략 적용
            SLEEP_SEC=$((RANDOM % 3 + 3))
            echo "😴 Sleeping ${SLEEP_SEC}s..."
            sleep $SLEEP_SEC
          done

      # ======================
      # JSON 그대로 업로드
      # ======================
      - name: Upload artifact (JSON)
        uses: actions/upload-artifact@v4
        with:
          name: fourblog-result-json
          path: result.json
          if-no-files-found: error
